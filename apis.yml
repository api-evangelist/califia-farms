aid: califia-farms
name: Califia Farms
description: 'Califia Farms, LLC is a Los Angeles, California based plant-based beverage
  company founded in 2010 by Greg Steltenpohl and named for the mythical Queen Califia.
  It manufactures and distributes non-dairy oatmilks, almondmilks and organic soymilks,
  coffee creamers, barista blends, cold brew coffees and teas, and ready-to-drink creamy
  refreshers, sold through grocery retail, foodservice distribution and direct-to-consumer
  channels across North America and Europe. Its public web presence is a marketing,
  recipe and where-to-buy site built on Gatsby and hosted on Netlify; the company publishes
  no developer program, no API documentation, and no machine-readable API contract.'
